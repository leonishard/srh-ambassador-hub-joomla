COM_AMBASSADORHUB_MANAGER_DASHBOARD="Ambassador Hub"
COM_AMBASSADORHUB_MANAGER_DASHBOARD_INTRO="Ambassador Hub is installed and its database tables are ready."
COM_AMBASSADORHUB_MANAGER_DASHBOARD_NOTE="Management screens for Groups, Events, Posts, Comments, Friendships and Group Proposals are added feature by feature; most day-to-day moderation happens on the frontend Review page for Coordinators."

COM_AMBASSADORHUB_MANAGER_ROLES="Roles &amp; Rights"
COM_AMBASSADORHUB_ROLES_INTRO="Ambassador Hub has three roles: Student, Group Manager, and Coordinator. This page is a read-only summary of what each can do and who currently holds them -- to change someone's role, use Users > Manage (Group Manager / Coordinator) or the frontend Review page (which Group a Manager runs)."

COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_TITLE="How this is enforced"
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_COORDINATOR="Coordinator is a real Joomla User Group permission (ambassadorhub.review) -- it applies everywhere, site-wide: reviewing Group Proposals and Events, reassigning or removing Group Managers, deleting any Group."
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_MANAGER="Group Manager is data-driven, not a blanket permission: each Group has its own manager (set automatically when a Coordinator approves that Group's proposal, or reassigns it), and that person can only manage that specific Group -- creating/editing its Posts and Events, editing its details. Being in the &quot;Group Manager&quot; User Group is just a label that is kept in sync for clarity in Users > Manage; it does not itself grant any Group."
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_STUDENT="Every other Registered user is a plain Student: they can join Groups, comment on Posts in Groups they belong to, RSVP to Events, send/accept friend requests, and propose a new Group for a Coordinator to review."

COM_AMBASSADORHUB_ROLES_COORDINATORS_HEADING="Coordinators"
COM_AMBASSADORHUB_ROLES_COORDINATORS_DESC="Site-wide review permission -- can approve/reject Group Proposals and Events, reassign Group Managers, and delete any Group."
COM_AMBASSADORHUB_ROLES_COORDINATORS_NONE="No one currently holds the Coordinator role."

COM_AMBASSADORHUB_ROLES_GROUP_MANAGERS_HEADING="Group Managers"
COM_AMBASSADORHUB_ROLES_GROUP_MANAGERS_DESC="Can manage Posts, Events, and details -- but only for the specific Group(s) listed below."
COM_AMBASSADORHUB_ROLES_GROUP_MANAGERS_NONE="No one currently holds the Group Manager role."
COM_AMBASSADORHUB_ROLES_MANAGES_NONE="Not currently managing a Group"

