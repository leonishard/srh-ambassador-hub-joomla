COM_AMBASSADORHUB_ROLES_GROUP_MANAGERS_DESC="Können Beiträge, Veranstaltungen und Details verwalten -- aber nur für die unten aufgeführte(n) Gruppe(n)."
COM_AMBASSADORHUB_ROLES_GROUP_MANAGERS_NONE="Aktuell hat niemand die Rolle Gruppenleiter."
