COM_AMBASSADORHUB_MANAGER_DASHBOARD="Ambassador Hub"
COM_AMBASSADORHUB_MANAGER_DASHBOARD_INTRO="Ambassador Hub ist installiert und seine Datenbanktabellen sind bereit."
COM_AMBASSADORHUB_MANAGER_DASHBOARD_NOTE="Verwaltungsbildschirme für Gruppen, Veranstaltungen, Beiträge, Kommentare, Freundschaften und Gruppenvorschläge werden Funktion für Funktion ergänzt; die tägliche Moderation erfolgt größtenteils über die Überprüfungsseite im Frontend für Koordinatoren."

COM_AMBASSADORHUB_MANAGER_ROLES="Rollen &amp; Rechte"
COM_AMBASSADORHUB_ROLES_INTRO="Ambassador Hub kennt drei Rollen: Studierende/r, Gruppenleiter und Koordinator. Diese Seite ist eine reine Übersicht, wer welche Rolle innehat und was diese kann -- um eine Rolle zu ändern, nutze Benutzer > Verwalten (Gruppenleiter / Koordinator) oder die Frontend-Überprüfungsseite (welche Gruppe ein Gruppenleiter führt)."

COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_TITLE="Wie dies technisch umgesetzt ist"
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_COORDINATOR="Koordinator ist eine echte Joomla-Benutzergruppenberechtigung (ambassadorhub.review) -- sie gilt sitezweit: Gruppenvorschläge und Veranstaltungen prüfen, Gruppenleiter neu zuweisen oder entfernen, jede Gruppe löschen."
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_MANAGER="Gruppenleiter ist datenbasiert, keine pauschale Berechtigung: Jede Gruppe hat ihren eigenen Leiter (wird automatisch gesetzt, wenn ein Koordinator den Gruppenvorschlag genehmigt oder die Leitung neu zuweist), und diese Person kann nur diese eine Gruppe verwalten -- deren Beiträge und Veranstaltungen erstellen/bearbeiten, Gruppendetails bearbeiten. Die Mitgliedschaft in der Benutzergruppe &quot;Gruppenleiter&quot; ist nur eine zur Klarheit synchron gehaltene Kennzeichnung in Benutzer > Verwalten; sie gewährt für sich genommen keine Gruppe."
COM_AMBASSADORHUB_ROLES_HOW_ENFORCED_STUDENT="Jede/r andere registrierte Nutzer/in ist eine/e einfache/r Studierende/r: Gruppen beitreten, Beiträge in den eigenen Gruppen kommentieren, bei Veranstaltungen zusagen, Freundschaftsanfragen senden/annehmen und eine neue Gruppe zur Prüfung durch einen Koordinator vorschlagen."

COM_AMBASSADORHUB_ROLES_COORDINATORS_HEADING="Koordinatoren"
COM_AMBASSADORHUB_ROLES_COORDINATORS_DESC="Sitezweite Prüfberechtigung -- kann Gruppenvorschläge und Veranstaltungen genehmigen/ablehnen, Gruppenleiter neu zuweisen und jede Gruppe löschen."
COM_AMBASSADORHUB_ROLES_COORDINATORS_NONE="Aktuell hat niemand die Rolle Koordinator."

